
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173b35">
<title>سامانه حضور و غیاب مداحی</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5f4;color:#24332e;font-family:Tahoma,sans-serif}
header{background:#173b35;color:white;text-align:center;padding:35px 15px}
header h1{font-size:24px}
header p{color:#d5e5df}
main{max-width:460px;margin:30px auto;padding:15px}
.card{background:white;padding:24px;border-radius:17px;box-shadow:0 5px 22px #00000010}
h2{text-align:center;font-size:20px}
.menu{display:grid;gap:13px;margin-top:25px}
button{border:0;border-radius:10px;padding:16px;font-size:16px;font-family:inherit;cursor:pointer}
.menu button{background:#1c594b;color:white}
.menu button:last-child{background:#e9f1ed;color:#173b35}
.menu button:nth-child(2){background:#344b45}
label{display:block;margin:15px 0 7px}
input{width:100%;padding:13px;border:1px solid #d5ded9;border-radius:9px;font-size:15px;font-family:inherit}
.action{width:100%;background:#1c594b;color:white;margin-top:22px}
.back{width:100%;background:#edf1ef;color:#173b35;margin-top:10px}
.page{display:none}
.page.active{display:block}
footer{text-align:center;color:#78847e;font-size:12px;margin:25px}
.member-card{padding:14px;margin-top:12px;border:1px solid #ddd;border-radius:10px}
</style>
</head>

<body>
<header>
<h1>سامانه حضور و غیاب</h1>
<p>کارگاه آموزشی مداحی</p>
</header>

<main>

<div class="card page active" id="home">
<h2>به سامانه خوش آمدید</h2>
<div class="menu">
<button onclick="showPage('member')">ورود اعضا</button>
<button onclick="showPage('admin')">ورود مدیر</button>
<button onclick="showPage('register')">ثبت‌نام اعضا</button>
</div>
</div>

<div class="card page" id="member">
<h2>ورود اعضا</h2>
<label>کد عضویت</label>
<input id="memberCode" placeholder="مثلاً MBR-A83F29C1">
<label>رمز عبور</label>
<input id="memberPassword" type="password" placeholder="رمز عبور">
<button class="action" onclick="login('member')">ورود به پنل اعضا</button>
<button class="back" onclick="showPage('home')">بازگشت</button>
</div>

<div class="card page" id="admin">
<h2>ورود مدیر</h2>
<label>رمز عبور مدیر</label>
<input id="adminPassword" type="password" placeholder="رمز عبور">
<button class="action" onclick="login('admin')">ورود</button>
<button class="back" onclick="showPage('home')">بازگشت</button>
</div>

<div class="card page" id="adminPanel">
<h2>پنل مدیریت</h2>
<p>به پنل مدیریت کارگاه خوش آمدید.</p>
<button class="action" onclick="loadMembers()">مشاهده اعضا</button>
<div id="membersList"></div>
<button class="back" onclick="showPage('home')">خروج</button>
</div>

<div class="card page" id="register">
<h2>ثبت‌نام عضو جدید</h2>

<label>نام</label>
<input id="firstName" placeholder="نام">

<label>نام خانوادگی</label>
<input id="lastName" placeholder="نام خانوادگی">

<label>نام پدر</label>
<input id="fatherName" placeholder="نام پدر">

<label>شماره تماس</label>
<input id="phone" type="tel" placeholder="شماره تماس">

<label>تاریخ تولد</label>
<input id="birthDate" type="date">

<label>رمز عبور</label>
<input id="newPassword" type="password" placeholder="حداقل ۸ کاراکتر">

<button class="action" onclick="registerMember()">ثبت‌نام</button>
<button class="back" onclick="showPage('home')">بازگشت</button>
</div>

<div class="card page" id="memberPanel">
<h2>پنل اعضا</h2>
<p id="memberWelcome">خوش آمدید.</p>
<p id="memberCodeDisplay"></p>
<h3>سوابق حضور و غیاب</h3>
<div id="attendanceList">در حال دریافت اطلاعات...</div>
<button class="back" onclick="logoutMember()">خروج از حساب</button>
</div>

<footer>سامانه اختصاصی کارگاه آموزشی مداحی</footer>
</main>

<script>
const SUPABASE_URL =
"https://puhckprfohwkyqlugmvm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lWBrsLRIUiWxPUo4Oq4jNA_S43aBUGs";

function showPage(id){
 document.querySelectorAll(".page").forEach(p=>{
   p.classList.remove("active");
 });
 document.getElementById(id).classList.add("active");
}

async function login(type){

 try{

  if(type==="admin"){

   const password=document.getElementById("adminPassword").value;

   const response=await fetch(
    SUPABASE_URL+"/functions/v1/Admin-login",
    {
     method:"POST",
     headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_KEY
     },
     body:JSON.stringify({password})
    }
   );

   const result=await response.json();

   if(!response.ok){
    alert(result.error||"ورود مدیر ناموفق بود.");
    return;
   }

   localStorage.setItem("adminSession",JSON.stringify(result.session));
   showPage("adminPanel");
   return;
  }

  const code=document.getElementById("memberCode").value.trim();
  const password=document.getElementById("memberPassword").value;

  if(!code||!password){
   alert("کد عضویت و رمز عبور را وارد کنید.");
   return;
  }

  const response=await fetch(
   SUPABASE_URL+"/functions/v1/member-auth",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "apikey":SUPABASE_KEY
    },
    body:JSON.stringify({
     action:"login",
     membership_code:code,
     password:password
    })
   }
  );

  const result=await response.json();

  if(!response.ok){
   alert(result.error||"ورود اعضا ناموفق بود.");
   return;
  }

  localStorage.setItem("memberSession",JSON.stringify(result));
  showPage("memberPanel");
  await loadMemberData();

 }catch(error){
  alert("ارتباط با سرور برقرار نشد. دوباره تلاش کنید.");
 }
}

async function registerMember(){

 const first_name=document.getElementById("firstName").value.trim();
 const last_name=document.getElementById("lastName").value.trim();
 const father_name=document.getElementById("fatherName").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const birth_date=document.getElementById("birthDate").value||null;
 const password=document.getElementById("newPassword").value;

 if(!first_name||!last_name||!father_name||!phone||!password){
  alert("لطفاً همه اطلاعات ضروری را وارد کنید.");
  return;
 }

 if(password.length<8){
  alert("رمز عبور باید حداقل ۸ کاراکتر باشد.");
  return;
 }

 try{

  const response=await fetch(
   SUPABASE_URL+"/functions/v1/member-auth",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "apikey":SUPABASE_KEY
    },
    body:JSON.stringify({
     action:"register",
     first_name,
     last_name,
     father_name,
     phone,
     birth_date,
     password
    })
   }
  );

  const result=await response.json();

  if(!response.ok){
   alert(result.error||"ثبت‌نام ناموفق بود.");
   return;
  }

  alert(
   "ثبت‌نام با موفقیت انجام شد.\n\nکد عضویت شما:\n"+
   result.membership_code+
   "\n\nاین کد را حتماً یادداشت کنید."
  );

  document.getElementById("memberCode").value=result.membership_code;
  document.getElementById("memberPassword").value="";
  document.getElementById("newPassword").value="";

  showPage("member");

 }catch(error){
  alert("ارتباط با سرور برقرار نشد.");
 }
}

async function loadMembers(){

 const raw=localStorage.getItem("adminSession");

 if(!raw){
  alert("ابتدا وارد حساب مدیر شوید.");
  showPage("admin");
  return;
 }

 try{

  const session=JSON.parse(raw);

  const response=await fetch(
   SUPABASE_URL+
   "/rest/v1/profiles?select=first_name,last_name,phone,membership_code&role=eq.member&order=created_at.desc",
   {
    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+session.access_token
    }
   }
  );

  const members=await response.json();

  if(!response.ok){
   alert("خطا در دریافت اعضا: "+(members.message||"خطای نامشخص"));
   return;
  }

  const list=document.getElementById("membersList");
  list.replaceChildren();

  if(members.length===0){
   list.textContent="هنوز عضوی ثبت نشده است.";
   return;
  }

  members.forEach(member=>{

   const card=document.createElement("div");
   card.className="member-card";

   const name=document.createElement("p");
   name.textContent=(member.first_name||"")+" "+(member.last_name||"");

   const code=document.createElement("p");
   code.textContent="کد عضویت: "+(member.membership_code||"ثبت نشده");

   const phone=document.createElement("p");
   phone.textContent="شماره تماس: "+(member.phone||"ثبت نشده");

   const copy=document.createElement("button");
   copy.textContent="کپی کد عضویت";

   copy.onclick=async()=>{
    try{
     await navigator.clipboard.writeText(member.membership_code||"");
     alert("کد عضویت کپی شد.");
    }catch{
     alert("کپی خودکار ممکن نیست.");
    }
   };

   card.append(name,code,phone,copy);
   list.appendChild(card);
  });

 }catch(error){
  alert("خطا در ارتباط با پایگاه داده.");
 }
}

async function loadMemberData(){

 const raw=localStorage.getItem("memberSession");

 if(!raw){
  showPage("member");
  return;
 }

 try{

  const saved=JSON.parse(raw);
  const session=saved.session;
  const user=saved.user;

  const headers={
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer "+session.access_token
  };

  const profileResponse=await fetch(
   SUPABASE_URL+
   "/rest/v1/profiles?select=first_name,last_name,membership_code&id=eq."+
   encodeURIComponent(user.id),
   {headers}
  );

  const profiles=await profileResponse.json();

  if(!profileResponse.ok||!profiles.length){
   document.getElementById("memberWelcome").textContent=
    "دریافت اطلاعات حساب ممکن نشد.";
   return;
  }

  const profile=profiles[0];

  document.getElementById("memberWelcome").textContent=
   "خوش آمدید، "+profile.first_name+" "+profile.last_name;

  document.getElementById("memberCodeDisplay").textContent=
   "کد عضویت: "+profile.membership_code;

  const attendanceResponse=await fetch(
   SUPABASE_URL+
   "/rest/v1/attendance?select=status,created_at,session_id&member_id=eq."+
   encodeURIComponent(user.id)+
   "&order=created_at.desc",
   {headers}
  );

  const records=await attendanceResponse.json();

  const list=document.getElementById("attendanceList");
  list.replaceChildren();

  if(!attendanceResponse.ok){
   list.textContent="دریافت سوابق حضور و غیاب ممکن نشد.";
   return;
  }

  if(records.length===0){
   list.textContent="هنوز سابقه‌ای برای شما ثبت نشده است.";
   return;
  }

  records.forEach(record=>{
   const item=document.createElement("div");
   item.className="member-card";

   const status=document.createElement("p");
   status.textContent=
    "وضعیت: "+(record.status==="present"?"حاضر":"غایب");

   const date=document.createElement("p");
   date.textContent=
    "تاریخ ثبت: "+new Date(record.created_at).toLocaleDateString("fa-IR");

   item.append(status,date);
   list.appendChild(item);
  });

 }catch(error){
  document.getElementById("attendanceList").textContent=
   "خطا در دریافت اطلاعات.";
 }
}

function logoutMember(){
 localStorage.removeItem("memberSession");
 document.getElementById("memberPassword").value="";
 showPage("home");
}
</script>

</body>
</html>
